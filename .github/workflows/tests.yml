# 깃허브에 올릴 때마다 전체 테스트를 돌립니다 (python tests/run_all.py).
# 모델·데이터·TTS 캐시·폰트는 저장소에 없으므로, 그것이 필요한 부분은 테스트가 스스로
# 건너뜁니다(SKIP). 카메라·마이크·GPU 없이 도는 검사만 여기서 확인합니다.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-train.txt
            requirements-server.txt

      - name: 시스템 라이브러리 (오디오 장치 라이브러리, OpenCV 그래픽, 한글 폰트)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libgl1 fonts-nanum

      - name: 파이썬 패키지 (GPU 없는 CPU 전용 torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-train.txt -r requirements-server.txt

      - name: 테스트
        run: python tests/run_all.py
